server:
  # 外部统一入口（前端 API_BASE=http://localhost:7070 与其一致）
  port: 7070

spring:
  application:
    # 服务名 = Nacos 注册名（网关自身也注册，便于统一监控与后续服务间互访）
    name: gateway
  config:
    # 配置中心：拉取共享配置（三端密钥）；optional 前缀保证 Nacos 不可用时本地兜底配置仍可启动
    import:
      - optional:nacos:common.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  # Redis：认证黑名单检查 + 可选 IP 限流，必须与用户服务同一实例（共享 auth:blacklist:*）
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3s
  cloud:
    nacos:
      # Nacos 注册中心 + 配置中心地址（与 docker-compose 中 nacos 服务一致）
      server-addr: localhost:8848
      # Nacos 3.x 默认开启鉴权，默认账号 nacos/nacos；如关闭鉴权可省略
      username: nacos
      password: nacos
      discovery:
        # 服务注册与发现（服务名取 spring.application.name）；namespace 为命名空间 ID，留空 = public
        group: DEFAULT_GROUP
      config:
        # 配置中心文件扩展名
        file-extension: yaml
        group: DEFAULT_GROUP
    gateway:
      # Cloud 2025.0（gateway 4.3.0）起，全部配置迁移到 server.webflux 前缀，
      # 旧的 spring.cloud.gateway.* 已废弃（IDE 会标红）
      server:
        webflux:
          # 路由拆分（按 path，顺序敏感：user-service 在前，rag-service 兜底）：
          #   - 认证 / 用户 / 角色管理 → 用户服务 spring-ai-user（经 Nacos 服务发现 lb://）
          #   - 其余 /api/**（知识库 / 文档 / 问答） → RAG 服务 spring-ai-rag（经 Nacos 服务发现 lb://）
          # 路径前缀均保持 /api，无需 StripPrefix
          routes:
            - id: user-service
              uri: lb://spring-ai-user
              predicates:
                - Path=/api/login,/api/register,/api/refresh,/api/logout,/api/user,/api/users/**,/api/admin/**
            - id: rag-service
              uri: lb://spring-ai-rag
              predicates:
                - Path=/api/**
              # 可选：按客户端 IP 限流（需 Redis）。启用时取消注释即可
              # filters:
              #   - name: RequestRateLimiter
              #     args:
              #       redis-rate-limiter.replenishRate: 10
              #       redis-rate-limiter.burstCapacity: 20
              #       key-resolver: "#{@clientIpKeyResolver}"
          globalcors:
            cors-configurations:
              '[/**]':
                # 允许任意来源；如网关与前端同源部署可收紧为具体域名
                allowed-origin-patterns:
                  - "*"
                allowed-methods:
                  - "*"
                allowed-headers:
                  - "*"
                allow-credentials: true
                max-age: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

# ============ 认证（网关集中校验） ============
jwt:
  # 必须与用户服务 spring-ai-user 的 jwt.secret 完全一致，否则签名校验失败
  secret: R4gD3m0-K3y-32ch4rs-L0ng-S3cur3!!
  # 校验用（不签发），过期时间配置仅供参考，实际以 token 内 claim 为准
  expiration-ms: 1800000

# 网关内部信任令牌：RAG 与用户服务据此确认请求来自本网关，三端必须一致
gateway:
  internal-token: rag-gw-trust-2026

# 服务间内部调用令牌：RAG 与用户服务互相调用 /internal/** 时携带，两端必须一致
internal-token: rag-internal-2026

logging:
  level:
    org.springframework.cloud.gateway: info
