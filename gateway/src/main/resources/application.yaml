server:
  port: 8081

spring:
  application:
    name: gateway
  # Redis：认证黑名单检查 + 可选 IP 限流，必须与 RAG 服务同一实例（共享 auth:blacklist:*）
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3s
  cloud:
    gateway:
      # Cloud 2025.0（gateway 4.3.0）起，全部配置迁移到 server.webflux 前缀，
      # 旧的 spring.cloud.gateway.* 已废弃（IDE 会标红）
      server:
        webflux:
          # 路由拆分（按 path，顺序敏感：user-service 在前，rag-service 兜底）：
          #   - 认证 / 用户 / 角色管理 → 用户服务 spring-ai-user（8082，独立服务）
          #   - 其余 /api/**（知识库 / 文档 / 问答） → RAG 服务 spring-ai-rag（8080）
          # 路径前缀均保持 /api，无需 StripPrefix
          routes:
            - id: user-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/login,/api/register,/api/refresh,/api/logout,/api/user,/api/users/**,/api/admin/**
            - id: rag-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/**
              # 可选：按客户端 IP 限流（需 Redis）。启用时取消注释即可
              # filters:
              #   - name: RequestRateLimiter
              #     args:
              #       redis-rate-limiter.replenishRate: 10
              #       redis-rate-limiter.burstCapacity: 20
              #       key-resolver: "#{@clientIpKeyResolver}"
          globalcors:
            cors-configurations:
              '[/**]':
                # 允许任意来源；如网关与前端同源部署可收紧为具体域名
                allowed-origin-patterns:
                  - "*"
                allowed-methods:
                  - "*"
                allowed-headers:
                  - "*"
                allow-credentials: true
                max-age: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

# ============ 认证（网关集中校验） ============
jwt:
  # 必须与用户服务 spring-ai-user 的 jwt.secret 完全一致，否则签名校验失败
  secret: R4gD3m0-K3y-32ch4rs-L0ng-S3cur3!!
  # 校验用（不签发），过期时间配置仅供参考，实际以 token 内 claim 为准
  expiration-ms: 1800000

# 网关内部信任令牌：RAG 与用户服务据此确认请求来自本网关，三端必须一致
gateway:
  internal-token: rag-gw-trust-2026

# 服务间内部调用令牌：RAG 与用户服务互相调用 /internal/** 时携带，两端必须一致
internal-token: rag-internal-2026

logging:
  level:
    org.springframework.cloud.gateway: info
