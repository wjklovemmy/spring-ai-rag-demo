# ============================================================
# spring-ai-web（Vue 3 + Vite 构建产物）Nginx 部署示例
#   1) 静态托管构建产物 dist/（默认 http://localhost:9000）
#   2) 将 /api/** 反向代理到网关 7070（前端同源调用，无跨域）
#
# 使用：
#   npm run build                     # 先构建出 dist/
#   nginx -c /path/to/spring-ai-web/nginx.conf   # 启动（按需调整 listen/root）
#   nginx -s reload                    # 重载
# ============================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen       9000;                       # 前端访问端口
        server_name  localhost;

        root   /path/to/spring-ai-web/dist;      # 改为 spring-ai-web/dist 实际路径（构建产物）
        index  index.html;

        # hash 路由（#/login、#/），无需 SPA fallback；根路径直接进登录页（由前端路由守卫处理）
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源（长缓存，文件名带 hash 的构建产物可放心缓存）
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        # API 反向代理到网关（页面内 API_BASE='' 即走此同源代理）
        location /api/ {
            proxy_pass http://localhost:7070;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;             # chat 接口耗时较长
            proxy_connect_timeout 5s;
        }
    }
}
