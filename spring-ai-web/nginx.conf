# ============================================================
# spring-ai-web（Vue 3 + Vite 构建产物）Nginx 配置
#   1) 静态托管构建产物 dist/（默认 http://localhost:9004）
#   2) 将 /api/** 反向代理到网关 7070（前端同源调用，无跨域）
#
# 两种使用方式：
#   A. docker compose（推荐）：
#       先构建前端：cd spring-ai-web && npm install && npm run build
#       docker compose -f docker/docker-compose.yml up -d frontend-nginx
#       → 容器内挂载本文件为 /etc/nginx/nginx.conf，dist 挂载到 /usr/share/nginx/html
#       → 反代目标为 host.docker.internal:7070（容器访问宿主机网关）
#   B. 宿主机手动部署（本机已装 nginx）：
#       npm run build
#       nginx -c /path/to/spring-ai-web/nginx.conf
#       需调整三处：listen（避开 9000~9003 的 minio）、root（改 dist 实际路径）、
#                   proxy_pass（改 localhost:7070）
# ============================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
		client_max_body_size 50M;
        listen       9004;                       # 前端访问端口（9000~9003 被 milvus/doc minio 占用）
        server_name  localhost;

        root   /usr/share/nginx/html;            # docker compose 挂载目录；本地手动部署请改为 spring-ai-web/dist 实际路径
        index  index.html;

        # hash 路由（#/login、#/），无需 SPA fallback；根路径直接进登录页（由前端路由守卫处理）
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源（长缓存，文件名带 hash 的构建产物可放心缓存）
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        # API 反向代理到网关（页面内 API_BASE='' 即走此同源代理）
        location /api/ {
            proxy_pass http://host.docker.internal:7080;   # docker 容器访问宿主机网关；本地手动部署改 localhost:7070
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;             # chat 接口耗时较长
            proxy_connect_timeout 5s;
        }
    }
}
