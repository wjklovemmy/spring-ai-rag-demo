spring:
  application:
    # 服务名 = Nacos 注册名，与网关 lb://spring-ai-user 路由、RAG 服务 user-service.internal-url 保持一致
    name: spring-ai-user
  config:
    # 配置中心：拉取共享配置（三端密钥）；optional 前缀保证 Nacos 不可用时本地兜底配置仍可启动
    import:
      - optional:nacos:common.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      # Nacos 注册中心 + 配置中心地址（与 docker-compose 中 nacos 服务一致）
      server-addr: localhost:8848
      # Nacos 3.x 默认开启鉴权，默认账号 nacos/nacos；如关闭鉴权可省略
      username: nacos
      password: nacos
      discovery:
        # 服务注册与发现（服务名取 spring.application.name）；namespace 为命名空间 ID，留空 = public
        group: DEFAULT_GROUP
      config:
        # 配置中心文件扩展名
        file-extension: yaml
        group: DEFAULT_GROUP
  datasource:
    # 用户域独立库 spring_ai_user（标准主数据源，MyBatis-Plus 自动装配）
    # 建库脚本见 sql/user.sql，5 张表：sys_user / sys_role / sys_permission / sys_user_role / sys_role_permission
    url: jdbc:mysql://localhost:3306/spring_ai_user?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    # Redis：Refresh Token 会话存储（与 Gateway 同实例，共享 jwt 校验黑名单）
    redis:
      host: localhost
      port: 6379
      # 如 Redis 设置过密码请在此配置，未设置则留空
      password:
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

server:
  port: 8082

# ==================== JWT 配置 ====================
# 本服务负责签发（登录/注册/刷新），校验上移到 Gateway，secret 必须与 gateway 一致
jwt:
  # 密钥（至少 256 位 / 32 字节），生产环境请使用强随机字符串并保密
  # 必须与 gateway 模块的 jwt.secret 完全一致，否则网关无法校验签名
  secret: R4gD3m0-K3y-32ch4rs-L0ng-S3cur3!!
  # 访问令牌（Access Token）过期时间（毫秒），默认 30 分钟
  expiration-ms: 1800000
  # 刷新令牌（Refresh Token）过期时间（毫秒），默认 7 天
  refresh-expiration-ms: 604800000

# ==================== 网关信任配置 ====================
# 网关内部信任令牌：GatewayIdentityFilter 校验 X-Gateway-Token 头，
# 确认请求经由网关转发（防绕过网关直连伪造身份），必须与 gateway 模块一致
gateway:
  internal-token: rag-gw-trust-2026

# ==================== RAG 服务回调配置 ====================
# 删除用户前的知识库授权校验/清理、管理操作审计，经 HTTP 回调 RAG 服务 /internal/kb/** 接口。
# lb:// 前缀经 Spring Cloud LoadBalancer 从 Nacos 注册中心解析服务实例（无需硬编码地址）
rag:
  # RAG 服务地址（内部接口不经过网关，直接调用）
  internal-url: lb://spring-ai-rag

# 服务间内部调用令牌：本服务调用 RAG /internal/kb/**、RAG 调用本服务 /internal/users/** 时
# 均携带 X-Internal-Token 头，两端必须一致（防未授权访问内部接口）
internal-token: rag-internal-2026
