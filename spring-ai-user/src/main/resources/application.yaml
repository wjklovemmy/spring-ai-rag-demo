spring:
  application:
    # 服务名 = Nacos 注册名，与网关 lb://spring-ai-user 路由、RAG 服务 UserFeignClient 服务名一致
    name: spring-ai-user
  config:
    # 配置中心：拉取共享配置（三端密钥）；optional 前缀保证 Nacos 不可用时本地兜底配置仍可启动
    import:
      - optional:nacos:common.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      # Nacos 注册中心 + 配置中心地址（与 docker-compose 中 nacos 服务一致）
      server-addr: localhost:8848
      # Nacos 3.x 默认开启鉴权，默认账号 nacos/nacos；如关闭鉴权可省略
      username: nacos
      password: nacos
      discovery:
        # 服务注册与发现（服务名取 spring.application.name）；namespace 为命名空间 ID，留空 = public
        group: DEFAULT_GROUP
      config:
        # 配置中心文件扩展名
        file-extension: yaml
        group: DEFAULT_GROUP
    sentinel:
      # 服务启动即注册到 transport（便于 Dashboard 展示）；默认懒注册
      eager: true
      transport:
        # Sentinel Dashboard 地址（可选：未启动 Dashboard 时仅告警，不影响熔断降级功能）。
        # Docker 方式：docker compose -f docker/docker-compose.yml up -d sentinel-dashboard（bladex/sentinel-dashboard:1.8.9，端口 8858）
        dashboard: localhost:8858
        # transport 指标上报端口（本服务，默认 8719，与 Dashboard 保持唯一）
        port: 8719
  datasource:
    # 用户域独立库 spring_ai_user（标准主数据源，MyBatis-Plus 自动装配）
    # 建库脚本见 sql/user.sql，5 张表：sys_user / sys_role / sys_permission / sys_user_role / sys_role_permission
    url: jdbc:mysql://localhost:3306/spring_ai_user?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    # Redis：Refresh Token 会话存储（与 Gateway 同实例，共享 jwt 校验黑名单）
    redis:
      host: localhost
      port: 6379
      # 如 Redis 设置过密码请在此配置，未设置则留空
      password:
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

server:
  port: 8082

# ==================== JWT 配置 ====================
# 本服务负责签发（登录/注册/刷新），校验上移到 Gateway，secret 必须与 gateway 一致
jwt:
  # 密钥（至少 256 位 / 32 字节），生产环境请使用强随机字符串并保密
  # 必须与 gateway 模块的 jwt.secret 完全一致，否则网关无法校验签名
  secret: R4gD3m0-K3y-32ch4rs-L0ng-S3cur3!!
  # 访问令牌（Access Token）过期时间（毫秒），默认 30 分钟
  expiration-ms: 1800000
  # 刷新令牌（Refresh Token）过期时间（毫秒），默认 7 天
  refresh-expiration-ms: 604800000

# ==================== 网关信任配置 ====================
# 网关内部信任令牌：GatewayIdentityFilter 校验 X-Gateway-Token 头，
# 确认请求经由网关转发（防绕过网关直连伪造身份），必须与 gateway 模块一致
gateway:
  internal-token: rag-gw-trust-2026

# ==================== OpenFeign 服务调用配置 ====================
# 跨服务回调 spring-ai-rag 的删除校验/清理/审计，服务名经 Nacos 注册中心解析实例并负载均衡
feign:
  # 开启熔断降级：调用失败/超时/熔断打开时走 RagSyncFeignClientFallbackFactory 安全兜底
  circuitbreaker:
    enabled: true
  # Sentinel 熔断规则（Spring Cloud Circuit Breaker Sentinel 实现，声明式配置）。
  # 资源名默认 = Feign 客户端服务名（spring-ai-rag）；精确到方法 = "服务名#方法(参数简单类型)"
  sentinel:
    # RefreshScope 刷新 / 配置中心变更时热更新规则
    enable-refresh-rules: true
    # 默认规则键名：rules 中该键的规则应用到所有 Feign 客户端
    default-rule: default
    rules:
      # 所有 Feign 客户端的默认熔断规则
      default:
        - grade: 0            # 熔断维度：0=异常比例 1=慢调用比例 2=异常数
          count: 0.5          # 触发阈值：异常比例 50%
          timeWindow: 10      # 熔断打开后的恢复窗口（秒）
          minRequestAmount: 5 # 触发熔断所需的最小请求数（避免小流量误熔断）
      # 精确到 RAG 删除前校验方法（该校验失败会阻止删除用户，语义重要，阈值保守）
      "spring-ai-rag#deletionCheck(Map)":
        - grade: 0
          count: 0.3          # 30% 异常比例即熔断
          timeWindow: 10
          minRequestAmount: 3
      # 精确到 RAG 清理/审计方法（异常数熔断，失败仅告警不阻塞主流程）
      "spring-ai-rag#userCleanup(Map)":
        - grade: 2
          count: 5
          timeWindow: 10
          minRequestAmount: 2
      "spring-ai-rag#audit(Map)":
        - grade: 2
          count: 5
          timeWindow: 10
          minRequestAmount: 2
  client:
    config:
      default:
        # 建立连接超时（毫秒）
        connect-timeout: 3000
        # 读取响应超时（毫秒）
        read-timeout: 10000

# 服务间内部调用令牌：本服务调用 RAG /internal/kb/**、RAG 调用本服务 /internal/users/** 时
# 均携带 X-Internal-Token 头（FeignConfig 拦截器注入），两端必须一致（防未授权访问内部接口）
internal-token: rag-internal-2026
