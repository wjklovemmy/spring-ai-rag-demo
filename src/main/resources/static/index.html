<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制台 - Knowledge Document</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0a1a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
        }

        /* 侧边栏 */
        .sidebar {
            width: 260px;
            background: rgba(255,255,255,0.02);
            border-right: 1px solid rgba(255,255,255,0.06);
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        .logo-text { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
            color: #94a3b8;
            font-size: 15px;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover { background: rgba(255,255,255,0.04); color: #e2e8f0; }
        .nav-item.active { background: rgba(99,102,241,0.15); color: #818cf8; }

        .nav-item svg { width: 20px; height: 20px; stroke: currentColor; flex-shrink: 0; }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            color: #f87171;
            font-size: 15px;
            width: 100%;
            transition: all 0.2s;
        }

        .logout-btn:hover { background: rgba(239,68,68,0.2); }

        /* 主内容 */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar {
            padding: 20px 32px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar-title { font-size: 20px; font-weight: 600; }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #94a3b8;
        }

        .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
        }

        .content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        /* 欢迎卡片 */
        .welcome-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            animation: fadeUp 0.6s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(6,182,212,0.2));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .welcome-card h2 {
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #a5b4fc, #67e8f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-card p { color: #64748b; font-size: 15px; line-height: 1.8; }

        /* 统计卡片 */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 32px;
        }

        .stat-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 24px;
            transition: all 0.3s;
        }

        .stat-card:hover {
            border-color: rgba(99,102,241,0.3);
            transform: translateY(-2px);
        }

        .stat-label { color: #64748b; font-size: 13px; margin-bottom: 8px; }
        .stat-value { font-size: 32px; font-weight: 700; }
        .stat-value.purple { color: #a78bfa; }
        .stat-value.blue { color: #67e8f9; }
        .stat-value.green { color: #34d399; }

        /* Toast 提示 */
        .toast-container {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            padding: 14px 20px;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards;
            max-width: 380px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .toast.success { background: rgba(52,211,153,0.9); }
        .toast.error { background: rgba(248,113,113,0.9); }
        .toast.info { background: rgba(99,102,241,0.9); }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-20px); } }

        /* 修复下拉框 option 白底看不清文字 */
        select option {
            background: #111128;
            color: #e2e8f0;
        }
    </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<aside class="sidebar">
    <div class="logo">
        <div class="logo-icon">R</div>
        <span class="logo-text">Knowledge Doc</span>
    </div>

    <button class="nav-item active" onclick="switchTab(this, 'home')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        首页
    </button>

    <button class="nav-item" onclick="switchTab(this, 'chat')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        知识问答
    </button>

    <button class="nav-item" onclick="switchTab(this, 'upload')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        上传文档
    </button>

    <button class="nav-item" onclick="switchTab(this, 'kb')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        知识库管理
    </button>

    <div class="sidebar-footer">
        <button class="logout-btn" onclick="logout()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            退出登录
        </button>
    </div>
</aside>

<main class="main">
    <header class="topbar">
        <h1 class="topbar-title" id="pageTitle">首页</h1>
        <div class="user-info">
            <div class="user-avatar" id="userAvatar">A</div>
            <span id="userName">admin</span>
        </div>
    </header>

    <div class="content">
        <!-- 首页 Tab -->
        <div id="tab-home" class="tab-content">
            <div class="welcome-card">
                <div class="welcome-icon">🚀</div>
                <h2>欢迎使用 Spring AI RAG 系统</h2>
                <p>基于 DeepSeek + DashScope + Milvus 的智能知识库<br>检索增强生成演示平台</p>
            </div>

            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-label">LLM 模型</div>
                    <div class="stat-value purple">DeepSeek</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">向量模型</div>
                    <div class="stat-value blue">V3</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">向量数据库</div>
                    <div class="stat-value green">Milvus</div>
                </div>
            </div>
        </div>

        <!-- 知识问答 Tab -->
        <div id="tab-chat" class="tab-content" style="display:none;">
            <div class="chat-area">
                <div style="margin-bottom:16px;display:flex;align-items:center;gap:12px;">
                    <label style="color:#94a3b8;font-size:14px;white-space:nowrap;">选择知识库：</label>
                    <select id="chatKbSelect"
                            style="flex:1;max-width:300px;height:42px;padding:0 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:#e2e8f0;font-size:14px;outline:none;cursor:pointer;">
                        <option value="">请选择知识库</option>
                    </select>
                </div>
                <div class="chat-msgs" id="chatMessages" style="min-height:400px;max-height:60vh;overflow-y:auto;padding:20px;background:rgba(255,255,255,0.02);border-radius:14px;border:1px solid rgba(255,255,255,0.06);margin-bottom:20px;">
                    <div style="text-align:center;color:#64748b;padding:60px 0;">输入问题开始 知识问答</div>
                </div>
                <div style="display:flex;gap:12px;">
                    <input type="text" id="questionInput" placeholder="请输入你的问题..."
                           style="flex:1;height:50px;padding:0 16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;color:#e2e8f0;font-size:15px;outline:none;"
                           onkeydown="if(event.key==='Enter') askQuestion()">
                    <button onclick="askQuestion()"
                            style="height:50px;padding:0 28px;border:none;border-radius:14px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:15px;font-weight:600;cursor:pointer;">
                        提问
                    </button>
                </div>
            </div>
        </div>

        <!-- 上传文档 Tab -->
        <div id="tab-upload" class="tab-content" style="display:none;">
            <div style="margin-bottom:20px;display:flex;align-items:center;gap:12px;">
                <label style="color:#94a3b8;font-size:14px;white-space:nowrap;">选择知识库：</label>
                <select id="uploadKbSelect"
                        style="flex:1;max-width:300px;height:42px;padding:0 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:#e2e8f0;font-size:14px;outline:none;cursor:pointer;">
                    <option value="">请选择知识库</option>
                </select>
            </div>
            <div style="margin-bottom:20px;display:flex;align-items:center;gap:12px;">
                <label style="color:#94a3b8;font-size:14px;white-space:nowrap;">岗位选择：</label>
                <select id="positionSelect"
                        style="height:42px;padding:0 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:#e2e8f0;font-size:14px;outline:none;cursor:pointer;">
                    <option value="">请选择岗位</option>
                    <option value="dev">研发</option>
                    <option value="finance">财务</option>
                    <option value="hr">人事</option>
                </select>
            </div>
            <div style="border:2px dashed rgba(99,102,241,0.3);border-radius:16px;padding:60px;text-align:center;cursor:pointer;transition:all 0.3s;background:rgba(255,255,255,0.01);"
                 id="uploadZone"
                 ondragover="event.preventDefault();this.style.borderColor='#818cf8'"
                 ondragleave="this.style.borderColor='rgba(99,102,241,0.3)'"
                 ondragenter="event.preventDefault()"
                 ondrop="handleDrop(event)">
                <div style="font-size:48px;margin-bottom:16px;">📄</div>
                <p style="color:#a5b4fc;font-size:18px;font-weight:600;margin-bottom:8px;">点击或拖拽 PDF 文件到此处</p>
                <p style="color:#64748b;font-size:13px;">支持 PDF 格式，最大 50MB</p>
                <input type="file" id="fileInput" accept=".pdf" style="display:none" onchange="uploadFile()">
                <button onclick="document.getElementById('fileInput').click()"
                        style="margin-top:20px;padding:10px 28px;border:1px solid rgba(99,102,241,0.4);border-radius:10px;background:rgba(99,102,241,0.1);color:#a5b4fc;cursor:pointer;font-size:14px;transition:all 0.3s;">
                    选择文件
                </button>
            </div>
            <div id="uploadResult" style="margin-top:16px;text-align:center;min-height:24px;"></div>
        </div>

        <!-- 知识库管理 Tab -->
        <div id="tab-kb" class="tab-content" style="display:none;">
            <!-- 创建知识库表单 -->
            <div style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:24px;margin-bottom:24px;">
                <h3 style="font-size:18px;margin-bottom:16px;">创建知识库</h3>
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end;">
                    <div>
                        <label style="display:block;color:#94a3b8;font-size:13px;margin-bottom:6px;">知识库名称 *</label>
                        <input type="text" id="kbName" placeholder="请输入知识库名称"
                               style="width:100%;height:42px;padding:0 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:#e2e8f0;font-size:14px;outline:none;">
                    </div>
                    <div>
                        <label style="display:block;color:#94a3b8;font-size:13px;margin-bottom:6px;">创建人 *</label>
                        <input type="text" id="kbCreator" placeholder="请输入创建人"
                               style="width:100%;height:42px;padding:0 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:#e2e8f0;font-size:14px;outline:none;">
                    </div>
                    <div>
                        <label style="display:block;color:#94a3b8;font-size:13px;margin-bottom:6px;">描述</label>
                        <input type="text" id="kbDesc" placeholder="知识库描述（可选）"
                               style="width:100%;height:42px;padding:0 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:#e2e8f0;font-size:14px;outline:none;">
                    </div>
                    <button onclick="createKnowledgeBase()"
                            style="height:42px;padding:0 24px;border:none;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:14px;font-weight:600;cursor:pointer;">
                        创建
                    </button>
                </div>
                <div id="kbCreateResult" style="margin-top:12px;min-height:20px;font-size:14px;"></div>
            </div>

            <!-- 知识库列表 -->
            <div style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:24px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                    <h3 style="font-size:18px;">知识库列表</h3>
                    <button onclick="loadKnowledgeBases()"
                            style="padding:8px 18px;border:1px solid rgba(99,102,241,0.4);border-radius:8px;background:rgba(99,102,241,0.1);color:#a5b4fc;cursor:pointer;font-size:13px;">
                        刷新
                    </button>
                </div>
                <div id="kbList" style="min-height:100px;">
                    <div style="text-align:center;color:#64748b;padding:40px 0;">点击刷新加载知识库列表</div>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    // ====== Toast 提示 ======
    function showToast(msg, type) {
        type = type || 'info';
        var container = document.getElementById('toastContainer');
        var el = document.createElement('div');
        el.className = 'toast ' + type;
        el.textContent = msg;
        container.appendChild(el);
        setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 3000);
    }

    // ====== 下载文件（不跳转） ======
    var _downloadToastActive = false;
    async function downloadFile(docId, docName) {
        // 清除上一次下载的相关提示
        var container = document.getElementById('toastContainer');
        container.innerHTML = '';
        showToast('正在下载 ' + docName + ' ...', 'info');
        try {
            var res = await fetch('/api/knowledge-document/' + docId + '/download');
            if (!res.ok) throw new Error('下载失败');
            var blob = await res.blob();
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            // 从响应头获取文件名，fallback 用 docName
            var disposition = res.headers.get('Content-Disposition');
            var filename = docName;
            if (disposition) {
                var match = disposition.match(/filename\*?=(?:UTF-8'')?([^;\s]+)/);
                if (match) filename = decodeURIComponent(match[1]);
            }
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            showToast(docName + ' 下载完成', 'success');
        } catch (e) {
            showToast('下载失败: ' + e.message, 'error');
        }
    }

    // ---- 登录状态检查 ----
    (async function checkAuth() {
        const res = await fetch('/api/user');
        if (!res.ok) {
            window.location.href = '/login.html';
            return;
        }
        const data = await res.json();
        document.getElementById('userName').textContent = data.username;
        document.getElementById('userAvatar').textContent = data.username.charAt(0).toUpperCase();
    })();

    async function logout() {
        await fetch('/api/logout');
        window.location.href = '/login.html';
    }

    // ---- Tab 切换 ----
    function switchTab(el, tab) {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
        document.getElementById('tab-' + tab).style.display = 'block';
        const titles = { home: '首页', chat: '知识问答', upload: '上传文档', kb: '知识库管理' };
        document.getElementById('pageTitle').textContent = titles[tab];
        if (tab === 'kb') loadKnowledgeBases();
        if (tab === 'chat' || tab === 'upload') loadKbSelectors();
    }

    // ---- 知识问答 ----
    async function askQuestion() {
        const input = document.getElementById('questionInput');
        const question = input.value.trim();
        if (!question) return;

        const kbId = document.getElementById('chatKbSelect').value;
        if (!kbId) {
            const msgs = document.getElementById('chatMessages');
            msgs.innerHTML += '<div style="color:#f87171;text-align:center;margin-bottom:12px;">请先选择知识库</div>';
            return;
        }

        const msgs = document.getElementById('chatMessages');
        msgs.innerHTML += '<div style="text-align:right;margin-bottom:12px;"><span style="background:rgba(99,102,241,0.2);padding:10px 16px;border-radius:12px;display:inline-block;max-width:80%;">' + question + '</span></div>';

        const loadingDiv = document.createElement('div');
        loadingDiv.innerHTML = '<span style="color:#64748b;">⏳ 思考中...</span>';
        msgs.appendChild(loadingDiv);
        msgs.scrollTop = msgs.scrollHeight;
        input.value = '';

        try {
            const res = await fetch('/api/knowledge-document/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question, knowledgeBaseId: Number(kbId) })
            });
            const data = await res.json();
            let html = '<div style="margin-bottom:12px;"><span style="background:rgba(255,255,255,0.05);padding:10px 16px;border-radius:12px;display:inline-block;max-width:80%;white-space:pre-wrap;">' + (data.answer || data.message) + '</span></div>';
            if (data.sources && data.sources.length > 0) {
                html += '<div style="margin-top:8px;color:#94a3b8;font-size:12px;padding-left:8px;border-left:2px solid #6366f1;">📖 参考来源：';
                data.sources.forEach((s, i) => {
                    html += '<br><span style="color:#6366f1;">[来源' + (i+1) + ']</span> ' + s.documentName + ' 第' + (s.pageNo || '1') + '页';
                    html += ' <a href="javascript:void(0)" onclick="downloadFile(' + s.documentId + ', \'' + (s.documentName || 'document').replace(/'/g, "\\'") + '\')" style="color:#818cf8;text-decoration:none;font-size:11px;" title="下载原文">⬇</a>';
                });
                html += '</div>';
            }
            loadingDiv.innerHTML = html;
        } catch (err) {
            loadingDiv.innerHTML = '<span style="color:#f87171;">请求失败，请重试</span>';
        }
        msgs.scrollTop = msgs.scrollHeight;
    }

    // ---- 文件上传 ----
    document.getElementById('uploadZone').addEventListener('click', () => {
        document.getElementById('fileInput').click();
    });

    function handleDrop(e) {
        e.preventDefault();
        e.currentTarget.style.borderColor = 'rgba(99,102,241,0.3)';
        const files = e.dataTransfer.files;
        if (files.length > 0) {
            document.getElementById('fileInput').files = files;
            uploadFile();
        }
    }

    async function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        const resultEl = document.getElementById('uploadResult');
        const file = fileInput.files[0];
        if (!file) return;

        const kbId = document.getElementById('uploadKbSelect').value;
        if (!kbId) {
            resultEl.innerHTML = '<span style="color:#f87171;">⚠️ 请先选择知识库</span>';
            return;
        }

        const position = document.getElementById('positionSelect').value;
        if (!position) {
            resultEl.innerHTML = '<span style="color:#f87171;">⚠️ 请先选择岗位类型</span>';
            return;
        }

        resultEl.innerHTML = '<span style="color:#64748b;">⏳ 正在上传并处理 ' + file.name + ' (岗位: ' + position + ')...</span>';

        const formData = new FormData();
        formData.append('file', file);
        formData.append('position', position);
        formData.append('knowledgeBaseId', kbId);

        try {
            const res = await fetch('/api/knowledge-document/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) {
                const verInfo = data.isUpdate ? ' <span style="color:#fbbf24;">(已更新为 v' + data.version + ')</span>' : ' <span style="color:#64748b;">(v' + data.version + ')</span>';
                resultEl.innerHTML = '<span style="color:#34d399;">✅ ' + file.name + verInfo + ' 成功，共 ' + data.chunkCount + ' 个片段已入库</span>';
            } else {
                resultEl.innerHTML = '<span style="color:#f87171;">❌ ' + data.message + '</span>';
            }
        } catch (err) {
            resultEl.innerHTML = '<span style="color:#f87171;">❌ 上传失败，请重试</span>';
        }
    }

    // ---- 知识库管理 ----
    async function loadKbSelectors() {
        try {
            const res = await fetch('/api/knowledge-base');
            const data = await res.json();
            if (data.success && data.data) {
                const options = data.data.map(kb => '<option value="' + kb.id + '">' + kb.name + (kb.status === 1 ? '' : ' [已禁用]') + '</option>').join('');
                document.getElementById('chatKbSelect').innerHTML = '<option value="">请选择知识库</option>' + options;
                document.getElementById('uploadKbSelect').innerHTML = '<option value="">请选择知识库</option>' + options;
            }
        } catch (err) {
            console.error('加载知识库列表失败', err);
        }
    }

    async function createKnowledgeBase() {
        const name = document.getElementById('kbName').value.trim();
        const creator = document.getElementById('kbCreator').value.trim();
        const desc = document.getElementById('kbDesc').value.trim();
        const resultEl = document.getElementById('kbCreateResult');

        if (!name) { resultEl.innerHTML = '<span style="color:#f87171;">请输入知识库名称</span>'; return; }
        if (!creator) { resultEl.innerHTML = '<span style="color:#f87171;">请输入创建人</span>'; return; }

        try {
            const res = await fetch('/api/knowledge-base', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, description: desc, createUser: creator })
            });
            const data = await res.json();
            if (data.success) {
                resultEl.innerHTML = '<span style="color:#34d399;">✅ 知识库「' + name + '」创建成功</span>';
                document.getElementById('kbName').value = '';
                document.getElementById('kbCreator').value = '';
                document.getElementById('kbDesc').value = '';
                loadKnowledgeBases();
            } else {
                resultEl.innerHTML = '<span style="color:#f87171;">❌ ' + data.message + '</span>';
            }
        } catch (err) {
            resultEl.innerHTML = '<span style="color:#f87171;">❌ 创建失败，请重试</span>';
        }
    }

    async function loadKnowledgeBases() {
        const listEl = document.getElementById('kbList');
        try {
            const res = await fetch('/api/knowledge-base');
            const data = await res.json();
            if (data.success && data.data && data.data.length > 0) {
                listEl.innerHTML = data.data.map(kb => `
                    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.05);">
                        <div>
                            <div style="font-weight:600;margin-bottom:4px;">${kb.name}</div>
                            <div style="color:#64748b;font-size:13px;">${kb.description || '暂无描述'} · 创建人: ${kb.createUser} · ${kb.createTime ? new Date(kb.createTime).toLocaleString('zh-CN') : ''}</div>
                        </div>
                        <div style="display:flex;align-items:center;gap:10px;">
                            <span style="font-size:12px;padding:2px 10px;border-radius:20px;${kb.status === 1 ? 'background:rgba(52,211,153,0.15);color:#34d399;' : 'background:rgba(148,163,184,0.1);color:#94a3b8;'}">${kb.status === 1 ? '启用' : '禁用'}</span>
                            <button onclick="deleteKnowledgeBase(${kb.id})"
                                    style="padding:4px 14px;border:1px solid rgba(239,68,68,0.3);border-radius:6px;background:rgba(239,68,68,0.1);color:#f87171;cursor:pointer;font-size:13px;">
                                删除
                            </button>
                        </div>
                    </div>
                `).join('');
            } else {
                listEl.innerHTML = '<div style="text-align:center;color:#64748b;padding:40px 0;">暂无知识库，请创建一个</div>';
            }
        } catch (err) {
            listEl.innerHTML = '<div style="text-align:center;color:#f87171;padding:40px 0;">加载失败，请重试</div>';
        }
    }

    async function deleteKnowledgeBase(id) {
        if (!confirm('确定要删除该知识库吗？此操作不可恢复。')) return;
        try {
            const res = await fetch('/api/knowledge-base/' + id, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) {
                loadKnowledgeBases();
            } else {
                alert(data.message);
            }
        } catch (err) {
            alert('删除失败，请重试');
        }
    }
</script>
</body>
</html>
