<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能知识库平台 - 登录/注册</title>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <style>
        :root {
            --bg: #0f1923;
            --card-bg: rgba(20, 30, 45, 0.85);
            --primary: #4fc3f7;
            --primary-dark: #0288d1;
            --success: #66bb6a;
            --text: #e0e0e0;
            --text-muted: #90a4ae;
            --border: rgba(79, 195, 247, 0.18);
            --input-bg: rgba(15, 23, 35, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: var(--text);
        }

        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 420px;
            max-width: 90vw;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 40px 36px;
            backdrop-filter: blur(18px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            font-size: 44px;
        }

        .logo h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 6px;
            letter-spacing: 1px;
        }

        .logo p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .tabs {
            display: flex;
            margin-bottom: 24px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.08);
        }

        .tabs button {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 15px;
            padding: 10px 0;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.25s;
        }

        .tabs button.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 11px 14px;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            transition: border-color 0.25s;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .form-group input::placeholder {
            color: #5a6a7a;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(79, 195, 247, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }

        .alert.error {
            display: block;
            background: rgba(239, 83, 80, 0.15);
            color: #ef5350;
            border: 1px solid rgba(239, 83, 80, 0.25);
        }

        .alert.success {
            display: block;
            background: rgba(102, 187, 106, 0.15);
            color: #66bb6a;
            border: 1px solid rgba(102, 187, 106, 0.25);
        }

        .register-extra {
            display: none;
        }

        .register-extra.show {
            display: block;
        }
    </style>
</head>
<body>
<div id="particles-js"></div>

<div class="login-container">
    <div class="card">
        <div class="logo">
            <div class="logo-icon">🧠</div>
            <h1>智能知识库平台</h1>
            <p>RAG 驱动的智能检索问答系统</p>
        </div>

        <div class="tabs">
            <button id="tab-login" class="active" onclick="switchTab('login')">登 录</button>
            <button id="tab-register" onclick="switchTab('register')">注 册</button>
        </div>

        <!-- 登录表单 -->
        <div id="form-login">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="form-group">
                <label>密 码</label>
                <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password">
            </div>
            <button class="btn btn-primary" onclick="handleLogin()" id="login-btn">登 录</button>
        </div>

        <!-- 注册表单 -->
        <div id="form-register" style="display:none;">
            <div class="form-group">
                <label>用户名 <span style="color:#ef5350">*</span></label>
                <input type="text" id="reg-username" placeholder="请输入用户名" autocomplete="off">
            </div>
            <div class="form-group register-extra">
                <label>昵称</label>
                <input type="text" id="reg-nickname" placeholder="输入显示昵称（可选）" autocomplete="off">
            </div>
            <div class="form-group register-extra">
                <label>邮箱</label>
                <input type="email" id="reg-email" placeholder="请输入邮箱（可选）" autocomplete="off">
            </div>
            <div class="form-group">
                <label>密 码 <span style="color:#ef5350">*</span></label>
                <input type="password" id="reg-password" placeholder="至少 6 位密码" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label>确认密码 <span style="color:#ef5350">*</span></label>
                <input type="password" id="reg-password2" placeholder="再次输入密码" autocomplete="new-password">
            </div>
            <button class="btn btn-primary" onclick="handleRegister()" id="reg-btn">注 册</button>
        </div>

        <div id="alert-box" class="alert"></div>
    </div>
</div>

<script>
    // --- Particles.js 背景动画 ---
    particlesJS('particles-js', {
        particles: {
            number: {value: 60, density: {enable: true, value_area: 800}},
            color: {value: '#4fc3f7'},
            shape: {type: 'circle'},
            opacity: {value: 0.5, random: true},
            size: {value: 3, random: true},
            line_linked: {enable: true, distance: 150, color: '#4fc3f7', opacity: 0.2, width: 1},
            move: {enable: true, speed: 1.2, direction: 'none', random: true, out_mode: 'out'}
        },
        interactivity: {
            detect_on: 'canvas',
            events: {onhover: {enable: true, mode: 'grab'}, onclick: {enable: true, mode: 'push'}},
            modes: {grab: {distance: 140, line_linked: {opacity: 0.5}}}
        },
        retina_detect: true
    });

    let currentTab = 'login';

    // 如果已有有效 Token，直接跳转到首页
    function checkExistingToken() {
        const token = localStorage.getItem('token');
        if (token) {
            // 快速验证 Token 是否仍然有效
            fetch('/api/user', {
                headers: {'Authorization': 'Bearer ' + token}
            }).then(res => {
                if (res.ok) {
                    window.location.href = '/index.html';
                } else {
                    localStorage.removeItem('token');
                }
            }).catch(() => {
                localStorage.removeItem('token');
            });
        }
    }
    checkExistingToken();

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tab-login').classList.toggle('active', tab === 'login');
        document.getElementById('tab-register').classList.toggle('active', tab === 'register');
        document.getElementById('form-login').style.display = tab === 'login' ? '' : 'none';
        document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
        document.getElementById('alert-box').className = 'alert';
        document.getElementById('alert-box').style.display = 'none';
    }

    function showAlert(msg, type) {
        const box = document.getElementById('alert-box');
        box.textContent = msg;
        box.className = 'alert ' + type;
        box.style.display = 'block';
    }

    function hideAlert() {
        document.getElementById('alert-box').style.display = 'none';
        document.getElementById('alert-box').className = 'alert';
    }

    // 登录
    async function handleLogin() {
        hideAlert();
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;

        if (!username || !password) {
            showAlert('请输入用户名和密码', 'error');
            return;
        }

        const btn = document.getElementById('login-btn');
        btn.disabled = true;
        btn.textContent = '登录中...';

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await res.json();

            if (res.ok && data.success) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('username', data.username);
                showAlert('登录成功，正在跳转...', 'success');
                setTimeout(() => { window.location.href = '/index.html'; }, 600);
            } else {
                showAlert(data.message || '登录失败', 'error');
            }
        } catch (e) {
            showAlert('网络错误，请稍后重试', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = '登 录';
        }
    }

    // 注册
    async function handleRegister() {
        hideAlert();
        const username = document.getElementById('reg-username').value.trim();
        const nickname = document.getElementById('reg-nickname').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        const password2 = document.getElementById('reg-password2').value;

        if (!username || !password) {
            showAlert('用户名和密码不能为空', 'error');
            return;
        }
        if (password.length < 6) {
            showAlert('密码至少需要 6 位', 'error');
            return;
        }
        if (password !== password2) {
            showAlert('两次输入的密码不一致', 'error');
            return;
        }

        const btn = document.getElementById('reg-btn');
        btn.disabled = true;
        btn.textContent = '注册中...';

        try {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password, nickname, email})
            });
            const data = await res.json();

            if (res.ok && data.success) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('username', data.username);
                showAlert('注册成功，正在跳转...', 'success');
                setTimeout(() => { window.location.href = '/index.html'; }, 600);
            } else {
                showAlert(data.message || '注册失败', 'error');
            }
        } catch (e) {
            showAlert('网络错误，请稍后重试', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = '注 册';
        }
    }

    // 回车键提交
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            if (currentTab === 'login') {
                handleLogin();
            } else {
                handleRegister();
            }
        }
    });
</script>
</body>
</html>
