<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Spring AI RAG Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0a1a;
            overflow: hidden;
        }

        /* ---- 动态背景层 ---- */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .bg-layer::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            animation: floatA 12s ease-in-out infinite;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            top: -200px;
            left: -100px;
        }

        .bg-layer::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            animation: floatB 14s ease-in-out infinite;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            bottom: -150px;
            right: -100px;
        }

        @keyframes floatA {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(100px, 80px) scale(1.1); }
            66% { transform: translate(-40px, -60px) scale(0.95); }
        }

        @keyframes floatB {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-80px, -100px) scale(1.15); }
            66% { transform: translate(60px, 40px) scale(0.9); }
        }

        /* ---- 粒子 ---- */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            animation: rise linear infinite;
        }

        @keyframes rise {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }

        /* ---- 登录卡片 ---- */
        .login-container {
            position: relative;
            z-index: 1;
            width: 420px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow:
                    0 8px 32px rgba(0, 0, 0, 0.4),
                    inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: cardIn 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ---- 头像区 ---- */
        .avatar-section {
            text-align: center;
            margin-bottom: 36px;
        }

        .avatar-ring {
            display: inline-block;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            animation: ringPulse 3s ease-in-out infinite;
        }

        @keyframes ringPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.3); }
            50% { box-shadow: 0 0 40px rgba(6, 182, 212, 0.5); }
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(10, 10, 26, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-inner svg {
            width: 36px;
            height: 36px;
            stroke: #a5b4fc;
        }

        .login-title {
            color: #e2e8f0;
            font-size: 24px;
            font-weight: 600;
            margin-top: 16px;
            letter-spacing: 0.5px;
        }

        .login-subtitle {
            color: #64748b;
            font-size: 13px;
            margin-top: 6px;
        }

        /* ---- 输入框 ---- */
        .input-group {
            position: relative;
            margin-bottom: 22px;
        }

        .input-group .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            stroke: #475569;
            transition: stroke 0.3s;
            z-index: 1;
        }

        .input-group:focus-within .icon {
            stroke: #818cf8;
        }

        .input-group input {
            width: 100%;
            height: 52px;
            padding: 0 16px 0 48px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #e2e8f0;
            font-size: 15px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-group input::placeholder {
            color: #475569;
        }

        .input-group input:focus {
            border-color: rgba(99, 102, 241, 0.5);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* ---- 错误消息 ---- */
        .error-msg {
            color: #f87171;
            font-size: 13px;
            text-align: center;
            min-height: 20px;
            margin-bottom: 8px;
            opacity: 0;
            transform: translateY(-4px);
            transition: all 0.3s;
        }

        .error-msg.show {
            opacity: 1;
            transform: translateY(0);
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        /* ---- 登录按钮 ---- */
        .login-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .login-btn .btn-text { transition: opacity 0.2s; }
        .login-btn .btn-spinner {
            display: none;
            position: absolute;
            inset: 0;
            justify-content: center;
            align-items: center;
        }
        .login-btn.loading .btn-text { opacity: 0; }
        .login-btn.loading .btn-spinner { display: flex; }

        .spinner-ring {
            width: 24px;
            height: 24px;
            border: 2.5px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---- 底部 ---- */
        .login-footer {
            text-align: center;
            margin-top: 28px;
            color: #475569;
            font-size: 12px;
        }
    </style>
</head>
<body>

<!-- 动态光晕背景 -->
<div class="bg-layer"></div>

<!-- 浮动粒子 -->
<div class="particles" id="particles"></div>

<!-- 登录卡片 -->
<div class="login-container">
    <div class="login-card">
        <!-- 头像 -->
        <div class="avatar-section">
            <div class="avatar-ring">
                <div class="avatar-inner">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
            </div>
            <h1 class="login-title">Knowledge Document</h1>
            <p class="login-subtitle">智能知识库检索增强生成系统</p>
        </div>

        <!-- 表单 -->
        <form id="loginForm" autocomplete="off">
            <div class="input-group">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <input type="text" id="username" placeholder="请输入用户名" autocomplete="off" />
            </div>

            <div class="input-group">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input type="password" id="password" placeholder="请输入密码" autocomplete="off" />
            </div>

            <div class="error-msg" id="errorMsg"></div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span class="btn-text">登 录</span>
                <span class="btn-spinner"><span class="spinner-ring"></span></span>
            </button>
        </form>

        <div class="login-footer">
            Spring Boot 4.0 &bull; Spring AI 2.0 &bull; Milvus
        </div>
    </div>
</div>

<script>
    // ---- 生成背景粒子 ----
    (function() {
        const container = document.getElementById('particles');
        const colors = ['rgba(99,102,241,0.4)', 'rgba(6,182,212,0.4)', 'rgba(139,92,246,0.4)', 'rgba(255,255,255,0.25)'];
        for (let i = 0; i < 40; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.width = p.style.height = (Math.random() * 5 + 2) + 'px';
            p.style.background = colors[Math.floor(Math.random() * colors.length)];
            p.style.animationDuration = (Math.random() * 15 + 10) + 's';
            p.style.animationDelay = (Math.random() * 15) + 's';
            container.appendChild(p);
        }
    })();

    // ---- 登录逻辑 ----
    const form = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        // 前端校验
        if (!username || !password) {
            showError('请输入用户名和密码');
            return;
        }

        // 进入 loading 状态
        errorMsg.classList.remove('show');
        loginBtn.classList.add('loading');

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();

            if (data.success) {
                // 登录成功，跳转到首页
                window.location.href = '/index.html';
            } else {
                showError(data.message || '登录失败，请重试');
            }
        } catch (err) {
            showError('网络异常，请检查连接后重试');
        } finally {
            loginBtn.classList.remove('loading');
        }
    });

    function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.remove('show');
        // 强制重启动画
        void errorMsg.offsetWidth;
        errorMsg.classList.add('show');
    }

    // 回车键聚焦下一个
    usernameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); passwordInput.focus(); }
    });
</script>
</body>
</html>
