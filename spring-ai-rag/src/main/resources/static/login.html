<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能知识库平台 - 登录/注册</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234fc3f7'/><text x='50' y='70' font-size='56' font-weight='bold' text-anchor='middle' fill='white'>K</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <style>
        :root {
            --bg: #0f1923;
            --card-bg: rgba(20, 30, 45, 0.85);
            --primary: #4fc3f7;
            --primary-dark: #0288d1;
            --success: #66bb6a;
            --text: #e0e0e0;
            --text-muted: #90a4ae;
            --border: rgba(79, 195, 247, 0.18);
            --input-bg: rgba(15, 23, 35, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: var(--text);
        }

        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 420px;
            max-width: 90vw;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 40px 36px;
            backdrop-filter: blur(18px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            font-size: 44px;
        }

        .logo h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 6px;
            letter-spacing: 1px;
        }

        .logo p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .tabs {
            display: flex;
            margin-bottom: 24px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.08);
        }

        .tabs button {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 15px;
            padding: 10px 0;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.25s;
        }

        .tabs button.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 11px 14px;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            transition: border-color 0.25s;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .form-group input::placeholder {
            color: #5a6a7a;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(79, 195, 247, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 12px;
        }

        .alert.error {
            background: rgba(239, 83, 80, 0.15);
            color: #ef5350;
            border: 1px solid rgba(239, 83, 80, 0.25);
        }

        .alert.success {
            background: rgba(102, 187, 106, 0.15);
            color: #66bb6a;
            border: 1px solid rgba(102, 187, 106, 0.25);
        }
    </style>
</head>
<body>
<div id="particles-js"></div>

<div id="app" class="login-container">
    <div class="card">
        <div class="logo">
            <div class="logo-icon">🧠</div>
            <h1>智能知识库平台</h1>
            <p>RAG 驱动的智能检索问答系统</p>
        </div>

        <div class="tabs">
            <button :class="{ active: tab === 'login' }" @click="switchTab('login')">登 录</button>
            <button :class="{ active: tab === 'register' }" @click="switchTab('register')">注 册</button>
        </div>

        <!-- 登录表单 -->
        <div v-show="tab === 'login'" @keydown.enter="handleLogin">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" v-model.trim="loginForm.username" placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="form-group">
                <label>密 码</label>
                <input type="password" v-model="loginForm.password" placeholder="请输入密码" autocomplete="current-password">
            </div>
            <button class="btn btn-primary" :disabled="submitting" @click="handleLogin">
                {{ submitting ? '登录中...' : '登 录' }}
            </button>
        </div>

        <!-- 注册表单 -->
        <div v-show="tab === 'register'" @keydown.enter="handleRegister">
            <div class="form-group">
                <label>用户名 <span style="color:#ef5350">*</span></label>
                <input type="text" v-model.trim="regForm.username" placeholder="请输入用户名" autocomplete="off">
            </div>
            <div class="form-group">
                <label>昵称</label>
                <input type="text" v-model.trim="regForm.nickname" placeholder="输入显示昵称（可选）" autocomplete="off">
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" v-model.trim="regForm.email" placeholder="请输入邮箱（可选）" autocomplete="off">
            </div>
            <div class="form-group">
                <label>密 码 <span style="color:#ef5350">*</span></label>
                <input type="password" v-model="regForm.password" placeholder="至少 6 位密码" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label>确认密码 <span style="color:#ef5350">*</span></label>
                <input type="password" v-model="regForm.password2" placeholder="再次输入密码" autocomplete="new-password">
            </div>
            <button class="btn btn-primary" :disabled="submitting" @click="handleRegister">
                {{ submitting ? '注册中...' : '注 册' }}
            </button>
        </div>

        <div v-if="alertMsg" class="alert" :class="alertType">{{ alertMsg }}</div>
    </div>
</div>

<script src="/js/vue.global.prod.js"></script>
<script>
    // ====== 网关 API 基础地址（页面由 RAG 8080 提供，接口统一走网关 8081） ======
    const API_BASE = 'http://localhost:8081';

    // --- Particles.js 背景动画 ---
    particlesJS('particles-js', {
        particles: {
            number: {value: 60, density: {enable: true, value_area: 800}},
            color: {value: '#4fc3f7'},
            shape: {type: 'circle'},
            opacity: {value: 0.5, random: true},
            size: {value: 3, random: true},
            line_linked: {enable: true, distance: 150, color: '#4fc3f7', opacity: 0.2, width: 1},
            move: {enable: true, speed: 1.2, direction: 'none', random: true, out_mode: 'out'}
        },
        interactivity: {
            detect_on: 'canvas',
            events: {onhover: {enable: true, mode: 'grab'}, onclick: {enable: true, mode: 'push'}},
            modes: {grab: {distance: 140, line_linked: {opacity: 0.5}}}
        },
        retina_detect: true
    });

    const { createApp } = Vue;

    createApp({
        data() {
            return {
                tab: 'login',
                submitting: false,
                alertMsg: '',
                alertType: '',
                loginForm: { username: '', password: '' },
                regForm: { username: '', nickname: '', email: '', password: '', password2: '' }
            };
        },
        mounted() {
            this.checkExistingToken();
        },
        methods: {
            clearAuth() {
                localStorage.removeItem('token');
                localStorage.removeItem('refreshToken');
                localStorage.removeItem('username');
            },
            // 如果已有有效 Token，直接跳转到首页；Access Token 过期则用 Refresh Token 自动续期
            checkExistingToken() {
                const token = localStorage.getItem('token');
                const refreshToken = localStorage.getItem('refreshToken');
                if (!token && !refreshToken) {
                    return;
                }
                fetch(API_BASE + '/api/user', {
                    headers: token ? { 'Authorization': 'Bearer ' + token } : {}
                }).then(res => {
                    if (res.ok) {
                        window.location.href = '/index.html';
                    } else if (refreshToken) {
                        this.tryRefresh(refreshToken);
                    } else {
                        this.clearAuth();
                    }
                }).catch(() => {
                    this.clearAuth();
                });
            },
            // 使用 Refresh Token 换取新双 Token，成功后跳转首页
            tryRefresh(refreshToken) {
                fetch(API_BASE + '/api/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refreshToken })
                }).then(res => res.json()).then(data => {
                    if (data.success) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('refreshToken', data.refreshToken);
                        localStorage.setItem('username', data.username);
                        window.location.href = '/index.html';
                    } else {
                        this.clearAuth();
                    }
                }).catch(() => {
                    this.clearAuth();
                });
            },
            switchTab(tab) {
                this.tab = tab;
                this.alertMsg = '';
            },
            showAlert(msg, type) {
                this.alertMsg = msg;
                this.alertType = type;
            },
            // 登录
            async handleLogin() {
                if (this.submitting) return;
                this.alertMsg = '';
                const { username, password } = this.loginForm;
                if (!username || !password) {
                    this.showAlert('请输入用户名和密码', 'error');
                    return;
                }
                this.submitting = true;
                try {
                    const res = await fetch(API_BASE + '/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('refreshToken', data.refreshToken);
                        localStorage.setItem('username', data.username);
                        this.showAlert('登录成功，正在跳转...', 'success');
                        setTimeout(() => { window.location.href = '/index.html'; }, 600);
                    } else {
                        this.showAlert(data.message || '登录失败', 'error');
                    }
                } catch (e) {
                    this.showAlert('网络错误，请稍后重试', 'error');
                } finally {
                    this.submitting = false;
                }
            },
            // 注册
            async handleRegister() {
                if (this.submitting) return;
                this.alertMsg = '';
                const { username, nickname, email, password, password2 } = this.regForm;
                if (!username || !password) {
                    this.showAlert('用户名和密码不能为空', 'error');
                    return;
                }
                if (password.length < 6) {
                    this.showAlert('密码至少需要 6 位', 'error');
                    return;
                }
                if (password !== password2) {
                    this.showAlert('两次输入的密码不一致', 'error');
                    return;
                }
                this.submitting = true;
                try {
                    const res = await fetch(API_BASE + '/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password, nickname, email })
                    });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('refreshToken', data.refreshToken);
                        localStorage.setItem('username', data.username);
                        this.showAlert('注册成功，正在跳转...', 'success');
                        setTimeout(() => { window.location.href = '/index.html'; }, 600);
                    } else {
                        this.showAlert(data.message || '注册失败', 'error');
                    }
                } catch (e) {
                    this.showAlert('网络错误，请稍后重试', 'error');
                } finally {
                    this.submitting = false;
                }
            }
        }
    }).mount('#app');
</script>
</body>
</html>
