spring:
  application:
    # 服务名 = Nacos 注册名，与网关 lb://spring-ai-rag 路由、用户服务 RagSyncFeignClient 服务名一致
    name: spring-ai-rag
  config:
    # 配置中心：拉取共享配置（三端密钥）+ 本服务专属配置（rag.tools 等，Nacos 上修改即热生效）；
    # optional 前缀保证 Nacos 不可用时本地兜底配置仍可启动
    import:
      - optional:nacos:common.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:spring-ai-rag.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      # Nacos 注册中心 + 配置中心地址（与 docker-compose 中 nacos 服务一致）
      server-addr: localhost:8848
      # Nacos 3.x 默认开启鉴权，默认账号 nacos/nacos；如关闭鉴权可省略
      username: nacos
      password: nacos
      discovery:
        # 服务注册与发现（服务名取 spring.application.name）；namespace 为命名空间 ID，留空 = public
        group: DEFAULT_GROUP
      config:
        # 配置中心文件扩展名
        file-extension: yaml
        group: DEFAULT_GROUP
    sentinel:
      # 服务启动即注册到 transport（便于 Dashboard 展示）；默认懒注册
      eager: true
      transport:
        # Sentinel Dashboard 地址（可选：未启动 Dashboard 时仅告警，不影响熔断降级功能）。
        # Docker 方式：docker compose -f docker/docker-compose.yml up -d sentinel-dashboard（bladex/sentinel-dashboard:1.8.9，端口 8858）
        dashboard: localhost:8858
        # transport 指标上报端口（本服务，默认 8719，与 Dashboard 保持唯一）
        port: 8719
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # 生产者端可靠性：消息是否真正送达 Broker
    # correlated：Broker 收到消息后异步 ack/nack（nack 回调把任务标记失败，见 RabbitConfig#rabbitTemplate）
    publisher-confirm-type: correlated
    # 路由失败退回：消息路由不到任何队列时触发 returnsCallback（mandatory 模式），避免静默丢弃
    publisher-returns: true
    listener:
      simple:
        # 消费失败重试：初始执行 1 次 + 重试 3 次 = 最多 4 次消费尝试，仍失败进死信队列
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000
          # max-retries = 重试次数（Spring Boot 4.x 语义），初始执行 1 次 + 重试 3 次 = 最多 4 次消费尝试
          max-retries: 3
        # 重试耗尽后不重新入队（避免无限循环），按业务队列声明的死信配置自动进死信队列
        default-requeue-rejected: false
        # 每消费者一次只取 1 条：任务串行处理（多实例下每实例 1 并发），
        # 避免同任务多线程并发抢占；任务处理耗时长，并发过高会打爆 embedding API 配额
        prefetch: 1
  ai:
    deepseek:
      base-url: https://api.deepseek.com
      # 从环境变量 DEEPSEEK_API_KEY 读取，未设置时留空
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        model: deepseek-chat
        # 知识库问答属事实性任务，低温保持稳定；如需更有创造性的回答可调高
        temperature: 0.3
    dashscope:
      # 从环境变量 DASHSCOPE_API_KEY 读取，未设置时留空
      api-key: ${DASHSCOPE_API_KEY:}
      embedding:
        model: text-embedding-v3
    vectorstore:
      milvus:
        database-name: default
        # collection-name 不再需要静态配置，由 VectorStoreService 按知识库动态创建 kb_{id}
        initialize-schema: false
        embedding-dimension: 1024
        index-type: IVF_FLAT
        metric-type: COSINE
        client:
          host: localhost
          port: 19530
  datasource:
    # 主数据源：RAG 业务库（由 DataSourceConfig 绑定到 HikariCP）
    # 用户域独立库 spring_ai_user 由独立服务 spring-ai-user（8082）连接，本服务不再持有
    url: jdbc:mysql://localhost:3306/knowledge_base?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接池参数（自定义，由 DataSourceConfig 绑定到 HikariCP）
    # Redis：多轮对话记忆（ChatMemory）存储，与用户服务/网关共用同一实例
    #（key：rag:chat:memory:{userId}:{sessionId}，按用户隔离，TTL 7 天）
    data:
      redis:
        host: localhost
        port: 6379
        # 如 Redis 设置过密码请在此配置，未设置则留空
        password:
        database: 0
        timeout: 3s
        lettuce:
          pool:
            max-active: 8
            max-idle: 8
            min-idle: 0
  task:
    pool:
      # 连接池名称，便于监控与日志区分
      pool-name: KnowledgeBase-HikariCP
      # 最大连接数（含空闲与在用）
      maximum-pool-size: 10
      # 最小空闲连接数（须 ≤ maximum-pool-size）
      minimum-idle: 2
      # 获取连接超时（毫秒）
      connection-timeout-ms: 30000
      # 空闲连接回收时间（毫秒，须 < max-lifetime-ms）
      idle-timeout-ms: 600000
      # 连接最大存活时间（毫秒，建议小于 MySQL wait_timeout）
      max-lifetime-ms: 1800000
      # 连接校验超时（毫秒，须 < connection-timeout-ms）
      validation-timeout-ms: 5000
      # 连接校验 SQL，留空则用 Hikari 默认数据库 ping
      connection-test-query: ""

server:
  port: 8080

# RAG 配置：文档分块参数（全局统一）
rag:
  # 召回重排序：向量召回候选后，用百炼 gte-rerank 精排，提升上下文质量
  rerank:
    enabled: true
    model: gte-rerank-v2
    # 向量召回候选数（先召回更多，再精排）
    candidate-top-k: 20
    # 精排后保留的片段数
    top-n: 5
    # 向量召回相似度阈值
    threshold: 0.3
    # Rerank 调用失败时降级为纯向量排序
    fallback-on-error: true
  # 混合检索：Dense 向量（Milvus）+ BM25 全文检索（Milvus 内置 analyzer）双路召回，RRF 融合
  # 需 Milvus 服务端 2.5+（BM25 稀疏向量与 chinese analyzer），SDK 版本见 pom 的 milvus-sdk.version
  hybrid:
    enabled: true
    # 每路（dense / bm25）召回候选数，最终融合取 rerank.candidate-top-k 条
    route-top-k: 40
    # 融合结果最低 RRF 分数，低于该值视为噪声丢弃（默认 0 不启用过滤，避免误伤召回）
    min-score: 0.0
    # RRF 平滑系数 k：score = Σ 1/(k + rank)
    rrf-k: 60
    # Hybrid 检索异常时降级为纯向量检索
    fallback-on-error: true
  # OCR：扫描版 PDF（无文本层）自动渲染页面并识别文字
  ocr:
    enabled: true
    # 阿里云 OCR 服务地域
    region-id: cn-hangzhou
    # 阿里云 AccessKey（建议用环境变量注入，勿提交到仓库）
    access-key-id: ${ALIYUN_OCR_AK:}
    access-key-secret: ${ALIYUN_OCR_SK:}
    # PDF 页渲染分辨率 DPI（越高识别越准、耗时越长）
    dpi: 200
    # 页文本低于该长度（字符）视为无文本层，触发 OCR
    min-text-length: 20
    # 单页 OCR 失败时是否抛异常中断（false=记日志跳过该页）
    fail-on-error: false
  # 文件存储配置：MinIO 对象存储（唯一后端，多实例部署下文件共享；
  # 已移除本地磁盘模式——本地盘在 K8s 多副本下实例间文件不互通）
  storage:
    minio:
      endpoint: http://localhost:9002
      access-key: minioadmin
      secret-key: minioadmin
      bucket: knowledge-documents
  document:
    # 文档版本共存天数：新版本上传后，旧版本仍可检索的天数，超期后自动过滤
    version-ttl-days: 30
    # 向量化批处理大小：每批 chunk 数（每批：embedding 批量调用一次 + Milvus upsert 一次 + 进度回写一次）
    batch-size: 100
    # 文档分块配置（全局统一）
    chunk:
      chunk-size: 800
      min-chunk-size-chars: 350
      min-chunk-length-to-embed: 80
      max-num-chunks: 10000
      keep-separator: true
      # 标题感知切分：识别标题行构建标题链，前缀注入 chunk（参与向量化）并写 metadata.heading
      heading:
        enabled: true
        # 标题链最大深度，如 "3 考勤制度 > 3.2 请假流程" 为 2 级
        max-depth: 3
        # 超过该字符数的行视为正文而非标题
        max-length: 40
        # 注入模板，{heading} 替换为标题链
        prefix-template: "【{heading}】"
      # 语义切片：段落 embedding 聚类，按相邻相似度找语义断点（失败自动降级 token 切分）
      semantic:
        enabled: true
        # 相邻段落余弦相似度阈值，低于该值视为语义断点（值越大切得越碎）
        threshold: 0.55
        # embedding 批量大小（DashScope text-embedding-v3 单次请求上限 10 条，超出自动分片）
        batch-size: 10
        # 过短段落并入相邻段，避免噪声干扰聚类
        min-segment-chars: 20
        fallback-on-error: true
      # Parent-Child 检索：语义/token 切分结果为父块（存 MySQL，不向量化），
      # 再按子块大小细分为子块（向量化存 Milvus）。
      # 检索命中子块后反查父块全文作为 LLM 上下文——小块召回更精准、父块上下文更完整。
      parent-child:
        enabled: true
        # 子块大小（tokens）：父块细分为子块的粒度，越小召回越精准、向量数越多
        child-chunk-size: 200
        # 子块最小字符数
        child-min-chunk-size-chars: 80
        # 子块最小可向量化长度（低于该长度不单独向量化，并入相邻子块）
        child-min-chunk-length-to-embed: 40
        # 子块最大数量上限（防御超大文档）
        child-max-num-chunks: 50000
        # 子块切分保留分隔符
        child-keep-separator: true
  # 工具调用（Tool Calling）限制：防止枚举/大纲类工具在大数据量下撑爆上下文。
  # 配置中心（Nacos）修改后热生效，无需重启（@ConfigurationProperties 自动重新绑定）
  tools:
    # 单份文档大纲标题数量上限：超过即停止扫描并提示截断
    outline-limit: 200
    # 一次大纲查询最多处理的文档数：文档过多时引导指定具体文档，避免枚举全部文档
    max-outline-docs: 20
    # 大纲结果文本总长度上限（字符）
    max-outline-chars: 12000
    # 文档清单最多展示条数：超限截断并引导关键词定位
    max-inventory-docs: 200
  # Sentinel 熔断降级规则（ai-chat 问答 / dashscope-embedding 向量化）：
  # 最小请求数 >= min-request-amount 且异常比例 >= exception-ratio 时熔断 time-window-seconds 秒。
  # 配置中心（Nacos）修改后热生效，无需重启（EnvironmentChangeEvent 监听重载）
  sentinel:
    ai-chat:
      exception-ratio: 0.5
      min-request-amount: 5
      time-window-seconds: 10
    embedding:
      exception-ratio: 0.5
      min-request-amount: 5
      time-window-seconds: 10
  # RabbitMQ 队列积压监控：定时轮询 Management API 读取业务队列 Ready（待消费）消息数，
  # 超过阈值触发告警（ERROR 日志 + 可选 Webhook），用于发现"消费者跟不上生产者"的消息积压。
  # 控制台：http://localhost:15672（默认账号 guest/guest，仅 localhost 可访问，本服务与 RabbitMQ 同机）
  mq-monitor:
    enabled: true
    # 轮询间隔（毫秒）：上一次检查完成后延迟该时长再检查
    interval-ms: 30000
    # Ready 消息数告警阈值：超过即判定积压并告警（多实例 prefetch=1 下，
    # 50 条 ≈ 50 × 单任务耗时；单任务约 2 分钟时 ≈ 100 分钟积压，可按业务容忍度调整）
    ready-threshold: 50
    management-url: http://localhost:15672
    management-username: guest
    management-password: guest
    # 企业微信/钉钉/飞书机器人 Webhook 地址，留空则仅打 ERROR 日志
    webhook-url: ""

# ==================== 网关信任配置 ====================
# 网关内部信任令牌：GatewayIdentityFilter 校验 X-Gateway-Token 头，
# 确认请求经由本服务网关转发（防绕过网关直连伪造身份），必须与 gateway 模块一致
gateway:
  internal-token: rag-gw-trust-2026

# ==================== OpenFeign 服务调用配置 ====================
# 跨服务调用 spring-ai-user 的用户摘要/管理员判定，服务名经 Nacos 注册中心解析实例并负载均衡
feign:
  # 开启熔断降级：调用失败/超时/熔断打开时走 UserFeignClientFallbackFactory 安全兜底
  circuitbreaker:
    enabled: true
  # Sentinel 熔断规则（Spring Cloud Circuit Breaker Sentinel 实现，声明式配置）。
  # 资源名默认 = Feign 客户端服务名（spring-ai-user）；精确到方法 = "服务名#方法(参数简单类型)"
  sentinel:
    # RefreshScope 刷新 / 配置中心变更时热更新规则
    enable-refresh-rules: true
    # 默认规则键名：rules 中该键的规则应用到所有 Feign 客户端
    default-rule: default
    rules:
      # 所有 Feign 客户端的默认熔断规则
      default:
        - grade: 0            # 熔断维度：0=异常比例 1=慢调用比例 2=异常数
          count: 0.5          # 触发阈值：异常比例 50%
          timeWindow: 10      # 熔断打开后的恢复窗口（秒）
          minRequestAmount: 5 # 触发熔断所需的最小请求数（避免小流量误熔断）
      # 精确到用户服务 isAdmin 方法（管理员判定影响知识库授权，阈值保守一点）
      "spring-ai-user#isAdmin(Long)":
        - grade: 0
          count: 0.3          # 30% 异常比例即熔断
          timeWindow: 10
          minRequestAmount: 3
      # 精确到用户服务 batch 方法（用户摘要批量查询，异常数熔断）
      "spring-ai-user#batch(Map)":
        - grade: 2            # 异常数熔断
          count: 5            # 10 秒内累计 5 次异常
          timeWindow: 10
          minRequestAmount: 2
  client:
    config:
      default:
        # 建立连接超时（毫秒）
        connect-timeout: 3000
        # 读取响应超时（毫秒）
        read-timeout: 10000

# 服务间内部调用令牌：本服务 /internal/kb/** 校验用户服务传来的 X-Internal-Token；
# 本服务调用用户服务 /internal/users/** 时也携带此令牌（FeignConfig 拦截器注入），两端必须一致
internal-token: rag-internal-2026
