version: '3.5'

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.0
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  attu:
    container_name: attu
    image: zilliz/attu
    ports:
      - "8000:3000"
    depends_on:
      - standalone

  doc-minio:
    container_name: knowledge-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - doc_minio_data:/data
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  doc-minio-init:
    container_name: knowledge-minio-init
    image: minio/mc:latest
    depends_on:
      doc-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set docminio http://doc-minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing docminio/knowledge-documents;
      echo 'Bucket knowledge-documents ready';
      exit 0;
      "

  app:
    container_name: spring-ai-rag-demo
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_AI_DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/knowledge_base?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_AI_VECTORSTORE_MILVUS_CLIENT_HOST=standalone
      - SPRING_AI_VECTORSTORE_MILVUS_CLIENT_PORT=19530
      - RAG_STORAGE_TYPE=minio
      - RAG_STORAGE_MINIO_ENDPOINT=http://doc-minio:9000
      - RAG_STORAGE_MINIO_ACCESS_KEY=minioadmin
      - RAG_STORAGE_MINIO_SECRET_KEY=minioadmin
      - RAG_STORAGE_MINIO_BUCKET=knowledge-documents
    depends_on:
      - standalone
      - doc-minio-init
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  default:
    name: milvus

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  doc_minio_data: