version: '3.5'

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.0
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  attu:
    container_name: attu
    image: zilliz/attu
    ports:
      - "8000:3000"
    depends_on:
      - standalone

  doc-minio:
    container_name: knowledge-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - doc_minio_data:/data
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  doc-minio-init:
    container_name: knowledge-minio-init
    image: minio/mc:latest
    depends_on:
      doc-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set docminio http://doc-minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing docminio/knowledge-documents;
      echo 'Bucket knowledge-documents ready';
      exit 0;
      "

  redis:
    container_name: knowledge-redis
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    # 开启 AOF 持久化：重启不丢 Refresh Token 会话
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Nacos 注册中心 + 配置中心（standalone 单机模式）
  # 控制台：http://localhost:8848/nacos（默认账号 nacos/nacos）
  # 客户端需同时连通 8848（HTTP）与 9848（gRPC），缺失 9848 会导致服务发现/配置拉取失败
  nacos:
    container_name: knowledge-nacos
    image: nacos/nacos-server:v3.1.1
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=SecretKey012345678901234567890123456789012345678901234567890123456789
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos_data:/home/nacos/data
    restart: unless-stopped

networks:
  default:
    name: milvus

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  doc_minio_data:
  redis_data:
  nacos_data: